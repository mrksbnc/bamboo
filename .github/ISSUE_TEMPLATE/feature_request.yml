name: 💡 Feature request
description: Suggest a feature for Bamboo.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an idea!
        If you have a usage question rather than a feature idea, make sure to:

        - Read the [docs](https://mrksbnc.github.io/bamboo/)
        - Ask on [GitHub Discussions](https://github.com/mrksbnc/bamboo/discussions)

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: "Ex. I'm always frustrated when [...]"
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen. If this involves a new or changed component/manifest, mention the affected package(s).
      placeholder: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context, mockups, or screenshots about the feature request here.
      placeholder: Additional context
    validations:
      required: false

  - type: checkboxes
    id: contributes
    attributes:
      label: Contributes
      options:
        - label: I am willing to submit a PR to implement this feature
